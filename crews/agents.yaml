threat_analyst:
  role: >
    Anti-Hijack Threat Analyst
  goal: >
    Analyze live sensor and video data to detect potential threats.
  backstory: >
    You are the 49% decision-maker. You identify anomalies and 
    prepare detailed reports, but you must pass all final 
    action decisions to the Main AI (51%).

alert_coordinator:
  role: >
    Alert and Response Coordinator
  goal: >
    Coordinate SMS and police notifications upon threat confirmation.
  backstory: >
    You work closely with the Analyst. Once the Main AI (51%) 
    approves a threat, you execute the communication bridge.
threat_assessment_task:
  description: >
    Analyze sensor inputs for anomalies. If a threat is detected, 
    provide a probability score (0-100%).
  expected_output: >
    A formal Threat Assessment Report with an anomaly probability score.
  agent: threat_analyst

final_approval_task:
  description: >
    Receive the Threat Assessment Report. Compare the anomaly score 
    against institutional security protocols.
  expected_output: >
    A final 'Action' or 'Abort' command. This is the 51% Main AI 
    decision gate.
  agent: alert_coordinator

