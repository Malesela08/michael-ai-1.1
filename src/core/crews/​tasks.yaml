def trigger_investigation_mission(incident_location):
    # The 51% Authority check
    if security_threshold_exceeded(incident_location):
        print("Main AI: Authorizing Drone Dispatch.")
        # Trigger the 49% Crew agent
        drone_crew.initiate_mission(location=incident_location)
    else:
        print("Main AI: Threat level insufficient for drone deployment.")
# brain/coordinator.py

def unified_response_protocol(sensor_data):
    # 1. Main AI detects and assesses danger
    danger_level = analyze_threat(sensor_data)
    
    if danger_level > 0.7:
        print("Danger Detected. Initiating Unified Response.")
        
        # 2. Immediate Investigation (Drone Deployment)
        drone_agent.dispatch(location=sensor_data.coordinates)
        
        # 3. Take Action based on live drone feed
        drone_feed = drone_agent.capture_live_video()
        if confirm_threat(drone_feed):
            trigger_police_alert("Urgent: Confirmed threat at location.")
            take_defensive_action()
