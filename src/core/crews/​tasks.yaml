    Analyze incoming live sensor and video data for anti-hijack anomalies. 
    Determine the probability of a threat occurring.
  expected_output: >
    A formal Threat Assessment Report with an anomaly probability score.
  agent: threat_analyst

alert_execution_task:
  description: >
    Receive the confirmed threat assessment. Coordinate and execute 
